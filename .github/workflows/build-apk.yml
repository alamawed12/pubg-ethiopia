name: Build Android Gate Scanner APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Android 5.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        working-directory: ./android-scanner
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android-scanner
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to Project Folders
        run: |
          mkdir -p public/downloads
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk public/downloads/pmca-gate-scanner.apk
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk android-scanner/pmca-gate-scanner.apk
          mkdir -p dist-apk
          cp android-scanner/app/build/outputs/apk/debug/app-debug.apk dist-apk/pmca-gate-scanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmca-gate-scanner-apk
          path: dist-apk/pmca-gate-scanner.apk
          retention-days: 30

      - name: Commit & Push APK to Repository Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/pmca-gate-scanner.apk android-scanner/pmca-gate-scanner.apk
          git commit -m "build(apk): add compiled pmca-gate-scanner.apk to project folder" || echo "No changes to commit"
          git push origin main || echo "Push completed"
