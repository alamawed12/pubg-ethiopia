name: Build Android Gate Scanner APK

on:
  push:
    paths:
      - 'android-scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Android 5.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./android-scanner
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android-scanner
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        working-directory: ./android-scanner
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/pmca-gate-scanner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmca-gate-scanner-apk
          path: android-scanner/app/build/outputs/apk/debug/pmca-gate-scanner.apk
          retention-days: 30
